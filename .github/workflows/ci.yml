name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Select the newest Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
          swift --version
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check
        run: scripts/check
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The newest official Swift image that satisfies swift-tools-version 6.4.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install zsh and git
        run: apt-get update && apt-get install -y zsh git
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check
        run: scripts/check
